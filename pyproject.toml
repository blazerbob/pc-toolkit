[project]
name = "pc-toolkit"
version = "0.1.0"
description = "Автоматизатор ПК для Windows: очистка, органайзер, бэкап, профили запуска, таймер питания, инфо о системе"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]